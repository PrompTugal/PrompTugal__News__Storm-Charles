# One job: checkout (shallow), build, gate, deploy, tag, measure. Target: push to served in about 40 s (PIPELINE.md section 3).
#   - fetch-depth 1 and nothing reads git history (a blobless full clone made the team site's gate 40x slower);
#   - the newest push wins: a run superseded by a newer push is cancelled (each build is the whole tree, nothing is lost);
#   - CI owns the version: v<series>.<run number>, written into the artifact and pushed as a tag; never committed
#     (no second push, no rebase race: BRIEF-CORRECTIONS.md, at Dinis's yes, 10 November 2026);
#   - after the deploy, it reads version.json from the live site until it serves this version, and reports push-to-served.
name: deploy
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Version
        run: |
          echo "VERSION=v$(cat admin/series.txt).${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "PUSHED_AT=${{ github.event.head_commit.timestamp }}" >> "$GITHUB_ENV"
      - name: Build and gate (the gate builds once; must print OK)
        run: node admin/build/validate.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tag the release
        if: github.event_name == 'push'
        run: |
          git tag "$VERSION" && git push -q origin "refs/tags/$VERSION" || echo "tag $VERSION not pushed"
      - name: Measure push to served
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 30); do
            got=$(curl -s -H 'Cache-Control: no-cache' "${PAGE_URL}version.json?t=$(date +%s%N)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")
            if [ "$got" = "$VERSION" ]; then break; fi
            sleep 2
          done
          now=$(date -u +%s); pushed=$(date -u -d "${PUSHED_AT:-now}" +%s)
          echo "push to served: $((now - pushed)) s ($VERSION, served: ${got:-not yet})" | tee -a "$GITHUB_STEP_SUMMARY"
